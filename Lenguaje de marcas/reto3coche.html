<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Coche</title>
    <style>
        body {
            font-family: Arial;
            background: #667eea;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            margin: 0 auto;
        }

        .car {
            position: relative;
            width: 200px;
            height: 100px;
            margin: 30px auto;
        }

        .body {
            width: 180px;
            height: 50px;
            background: #e74c3c;
            border-radius: 10px;
            position: absolute;
            bottom: 20px;
            left: 10px;
        }

        .roof {
            width: 100px;
            height: 35px;
            background: #e74c3c;
            border-radius: 20px 20px 0 0;
            position: absolute;
            bottom: 70px;
            left: 50px;
        }

        .wheel {
            width: 35px;
            height: 35px;
            background: #333;
            border-radius: 50%;
            position: absolute;
            bottom: 5px;
        }

        .wheel-f { left: 30px; }
        .wheel-b { right: 30px; }

        input, button {
            margin: 10px;
            padding: 10px;
            font-size: 16px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 Mi Coche</h1>
        
        <div class="car">
            <div class="body" id="body"></div>
            <div class="roof" id="roof"></div>
            <div class="wheel wheel-f"></div>
            <div class="wheel wheel-b"></div>
        </div>

        <div>
            <label>Color: </label>
            <input type="color" id="color" value="#e74c3c">
        </div>

        <div>
            <button onclick="cambiarTipo('sedan')">Sedán</button>
            <button onclick="cambiarTipo('suv')">SUV</button>
        </div>
    </div>

    <script>
        const body = document.getElementById('body');
        const roof = document.getElementById('roof');

        document.getElementById('color').oninput = (e) => {
            body.style.background = e.target.value;
            roof.style.background = e.target.value;
        };

        function cambiarTipo(tipo) {
            if (tipo === 'suv') {
                body.style.height = '60px';
                roof.style.height = '40px';
                roof.style.bottom = '85px';
            } else {
                body.style.height = '50px';
                roof.style.height = '35px';
                roof.style.bottom = '70px';
            }
        }
    </script>
</body>
</html>
