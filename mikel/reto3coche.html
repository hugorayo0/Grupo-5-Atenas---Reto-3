<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalizador de Coche</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .car-display {
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 50%, #808080 50%, #606060 100%);
            border-radius: 15px;
            padding: 60px 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
        }

        .car {
            position: relative;
            width: 400px;
            height: 150px;
        }

        .car-body {
            position: absolute;
            width: 350px;
            height: 80px;
            background: #e74c3c;
            border-radius: 20px 20px 10px 10px;
            bottom: 40px;
            left: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .car-logo {
            position: absolute;
            width: 25px;
            height: 20px;
            background: linear-gradient(135deg, #8B4513 0%, #654321 100%);
            border-radius: 60% 40% 50% 50% / 60% 60% 40% 40%;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .car-logo::after {
            content: '';
            position: absolute;
            width: 70%;
            height: 80%;
            background: #9ACD32;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .car-roof {
            position: absolute;
            width: 200px;
            height: 60px;
            background: #e74c3c;
            border-radius: 40px 40px 0 0;
            bottom: 120px;
            left: 100px;
        }

        .window-front, .window-back {
            position: absolute;
            background: rgba(100, 200, 255, 0.6);
            bottom: 125px;
        }

        .window-front {
            width: 80px;
            height: 50px;
            left: 110px;
            border-radius: 30px 0 0 0;
            clip-path: polygon(0 0, 100% 20%, 100% 100%, 0 100%);
        }

        .window-back {
            width: 80px;
            height: 50px;
            left: 210px;
            border-radius: 0 30px 0 0;
            clip-path: polygon(0 20%, 100% 0, 100% 100%, 0 100%);
        }

        .wheel {
            position: absolute;
            width: 60px;
            height: 60px;
            background: #2c3e50;
            border-radius: 50%;
            bottom: 10px;
            box-shadow: inset 0 0 0 8px #34495e, inset 0 0 0 12px #2c3e50, 0 5px 10px rgba(0,0,0,0.3);
        }

        .wheel-front { left: 60px; }
        .wheel-back { right: 60px; }

        .wheel.sport {
            box-shadow: inset 0 0 0 5px #e74c3c, inset 0 0 0 10px #34495e, inset 0 0 0 15px #2c3e50, 0 5px 10px rgba(0,0,0,0.3);
        }

        .wheel.off-road {
            box-shadow: inset 0 0 0 3px #34495e, inset 0 0 0 6px #2c3e50, inset 0 0 0 9px #34495e, inset 0 0 0 12px #2c3e50, 0 5px 10px rgba(0,0,0,0.3);
        }

        .mirror {
            position: absolute;
            width: 15px;
            height: 25px;
            background: #2c3e50;
            border-radius: 5px;
            bottom: 100px;
        }

        .mirror-left {
            left: 15px;
            transform: skewY(-10deg);
        }

        .mirror-right {
            right: 15px;
            transform: skewY(10deg);
        }

        .mirror::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 20px;
            background: rgba(100, 200, 255, 0.4);
            border-radius: 3px;
            top: 2px;
            left: 3px;
        }

        .spoiler {
            position: absolute;
            width: 280px;
            height: 8px;
            background: #2c3e50;
            bottom: 120px;
            right: 50px;
            border-radius: 2px;
            box-shadow: 0 -3px 8px rgba(0,0,0,0.3);
        }

        .spoiler::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 25px;
            background: #2c3e50;
            bottom: 0;
            left: 30px;
            border-radius: 2px;
        }

        .spoiler::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 25px;
            background: #2c3e50;
            bottom: 0;
            right: 30px;
            border-radius: 2px;
        }

        .factory-belt {
            background: #2c3e50;
            border-radius: 15px;
            padding: 30px 20px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .belt-track {
            background: repeating-linear-gradient(
                90deg,
                #34495e 0px,
                #34495e 30px,
                #2c3e50 30px,
                #2c3e50 40px
            );
            height: 20px;
            border-radius: 10px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
            animation: beltMove 3s linear infinite;
        }

        @keyframes beltMove {
            0% { background-position: 0 0; }
            100% { background-position: 40px 0; }
        }

        .factory-cars {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding: 30px 0;
            gap: 20px;
            flex-wrap: wrap;
        }

        .factory-car {
            cursor: pointer;
            transition: transform 0.3s;
            flex: 1;
            min-width: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .factory-car:hover {
            transform: scale(1.1);
        }

        .factory-car.selected {
            transform: scale(1.15);
        }

        .factory-car-preview {
            position: relative;
            width: 120px;
            height: 90px;
            margin-bottom: 10px;
        }

        .factory-label {
            color: white;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            background: rgba(0,0,0,0.3);
            padding: 5px 10px;
            border-radius: 5px;
        }

        .mini-car-body {
            position: absolute;
            width: 100px;
            height: 30px;
            background: #e74c3c;
            border-radius: 8px 8px 4px 4px;
            bottom: 15px;
            left: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .mini-car-roof {
            position: absolute;
            width: 60px;
            height: 25px;
            background: #e74c3c;
            border-radius: 15px 15px 0 0;
            bottom: 45px;
            left: 30px;
        }

        .mini-window-front, .mini-window-back {
            position: absolute;
            background: rgba(100, 200, 255, 0.6);
            bottom: 47px;
        }

        .mini-window-front {
            width: 25px;
            height: 20px;
            left: 33px;
            border-radius: 10px 0 0 0;
            clip-path: polygon(0 0, 100% 20%, 100% 100%, 0 100%);
        }

        .mini-window-back {
            width: 25px;
            height: 20px;
            left: 62px;
            border-radius: 0 10px 0 0;
            clip-path: polygon(0 20%, 100% 0, 100% 100%, 0 100%);
        }

        .mini-wheel {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #2c3e50;
            border-radius: 50%;
            bottom: 5px;
            box-shadow: inset 0 0 0 3px #34495e;
        }

        .mini-wheel-front { left: 20px; }
        .mini-wheel-back { right: 20px; }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
        }

        .control-group {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .control-group h3 {
            color: #555;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-weight: 500;
        }

        select, input[type="color"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:hover, input[type="color"]:hover {
            border-color: #667eea;
        }

        select:focus, input[type="color"]:focus {
            outline: none;
            border-color: #667eea;
        }

        input[type="color"] {
            height: 45px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <div class="kiwi-logo">
                <div class="kiwi-seeds">
                    <div class="seed"></div>
                    <div class="seed"></div>
                    <div class="seed"></div>
                    <div class="seed"></div>
                    <div class="seed"></div>
                    <div class="seed"></div>
                    <div class="seed"></div>
                </div>
            </div>
            🚗 Personalizador de Coche
        </h1>
        
        <div class="factory-belt">
            <h2 style="color: white; text-align: center; margin-bottom: 20px;">🏭 Línea de Producción</h2>
            <div class="factory-cars">
                <div class="factory-car selected" data-type="sedan" onclick="selectCarType('sedan')">
                    <div class="factory-car-preview">
                        <div class="mini-car-body"></div>
                        <div class="mini-car-roof"></div>
                        <div class="mini-window-front"></div>
                        <div class="mini-window-back"></div>
                        <div class="mini-wheel mini-wheel-front"></div>
                        <div class="mini-wheel mini-wheel-back"></div>
                    </div>
                    <div class="factory-label">Sedán</div>
                </div>

                <div class="factory-car" data-type="suv" onclick="selectCarType('suv')">
                    <div class="factory-car-preview">
                        <div class="mini-car-body" style="height: 35px; bottom: 18px;"></div>
                        <div class="mini-car-roof" style="width: 70px; height: 28px; left: 25px; bottom: 53px;"></div>
                        <div class="mini-window-front" style="bottom: 55px; left: 28px;"></div>
                        <div class="mini-window-back" style="bottom: 55px; left: 57px;"></div>
                        <div class="mini-wheel mini-wheel-front" style="width: 22px; height: 22px;"></div>
                        <div class="mini-wheel mini-wheel-back" style="width: 22px; height: 22px;"></div>
                    </div>
                    <div class="factory-label">SUV</div>
                </div>

                <div class="factory-car" data-type="deportivo" onclick="selectCarType('deportivo')">
                    <div class="factory-car-preview">
                        <div class="mini-car-body" style="height: 25px; bottom: 13px; border-radius: 12px 12px 3px 3px;"></div>
                        <div class="mini-car-roof" style="width: 50px; height: 20px; bottom: 38px; left: 35px; border-radius: 10px 10px 0 0;"></div>
                        <div class="mini-window-front" style="bottom: 40px; left: 38px; height: 18px;"></div>
                        <div class="mini-window-back" style="bottom: 40px; left: 62px; height: 18px; width: 20px;"></div>
                        <div class="mini-wheel mini-wheel-front" style="width: 22px; height: 22px;"></div>
                        <div class="mini-wheel mini-wheel-back" style="width: 22px; height: 22px;"></div>
                    </div>
                    <div class="factory-label">Deportivo</div>
                </div>

                <div class="factory-car" data-type="pickup" onclick="selectCarType('pickup')">
                    <div class="factory-car-preview">
                        <div class="mini-car-body" style="width: 110px; height: 28px; bottom: 15px;"></div>
                        <div class="mini-car-roof" style="width: 40px; height: 25px; bottom: 43px; left: 25px;"></div>
                        <div class="mini-window-front" style="bottom: 45px; left: 28px; width: 18px;"></div>
                        <div class="mini-window-back" style="bottom: 45px; left: 48px; width: 12px;"></div>
                        <div class="mini-wheel mini-wheel-front"></div>
                        <div class="mini-wheel mini-wheel-back"></div>
                    </div>
                    <div class="factory-label">Pick-up</div>
                </div>
            </div>
            <div class="belt-track"></div>
        </div>
        
        <div class="car-display">
            <div class="car">
                <div class="car-body" id="carBody">
                    <div class="car-logo"></div>
                </div>
                <div class="car-roof" id="carRoof"></div>
                <div class="window-front" id="windowFront"></div>
                <div class="window-back" id="windowBack"></div>
                <div class="wheel wheel-front" id="wheelFront"></div>
                <div class="wheel wheel-back" id="wheelBack"></div>
                <div class="mirror mirror-left" id="mirrorLeft" style="display: none;"></div>
                <div class="mirror mirror-right" id="mirrorRight" style="display: none;"></div>
                <div class="spoiler" id="spoiler" style="display: none;"></div>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <h3>🎨 Color del Coche</h3>
                <label for="carColor">Color de la carrocería:</label>
                <input type="color" id="carColor" value="#e74c3c">
            </div>

            <div class="control-group">
                <h3>🪟 Color de Ventanas</h3>
                <label for="windowColor">Color de las ventanas:</label>
                <input type="color" id="windowColor" value="#64c8ff">
            </div>

            <div class="control-group">
                <h3>🔍 Retrovisores</h3>
                <label for="mirrors">Añadir retrovisores:</label>
                <select id="mirrors">
                    <option value="no">Sin retrovisores</option>
                    <option value="yes">Con retrovisores</option>
                </select>
            </div>

            <div class="control-group">
                <h3>⚙️ Tipo de Ruedas</h3>
                <label for="wheelType">Estilo de ruedas:</label>
                <select id="wheelType">
                    <option value="normal">Normales</option>
                    <option value="sport">Deportivas</option>
                    <option value="off-road">Todo terreno</option>
                </select>
            </div>

            <div class="control-group">
                <h3>✈️ Alerón</h3>
                <label for="spoiler">Añadir alerón:</label>
                <select id="spoiler">
                    <option value="no">Sin alerón</option>
                    <option value="yes">Con alerón</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        const carBody = document.getElementById('carBody');
        const carRoof = document.getElementById('carRoof');
        const windowFront = document.getElementById('windowFront');
        const windowBack = document.getElementById('windowBack');
        const wheelFront = document.getElementById('wheelFront');
        const wheelBack = document.getElementById('wheelBack');
        const mirrorLeft = document.getElementById('mirrorLeft');
        const mirrorRight = document.getElementById('mirrorRight');
        const spoilerEl = document.getElementById('spoiler');

        let currentCarType = 'sedan';

        const carStyles = {
            sedan: {
                body: { width: '350px', height: '80px', bottom: '40px', left: '25px', borderRadius: '20px 20px 10px 10px' },
                roof: { width: '200px', height: '60px', bottom: '120px', left: '100px', borderRadius: '40px 40px 0 0' },
                windowFront: { width: '80px', height: '50px', bottom: '125px', left: '110px', borderRadius: '30px 0 0 0' },
                windowBack: { width: '80px', height: '50px', bottom: '125px', left: '210px', borderRadius: '0 30px 0 0' }
            },
            suv: {
                body: { width: '350px', height: '90px', bottom: '45px', left: '25px', borderRadius: '20px 20px 10px 10px' },
                roof: { width: '240px', height: '70px', bottom: '135px', left: '80px', borderRadius: '35px 35px 0 0' },
                windowFront: { width: '90px', height: '60px', bottom: '140px', left: '90px', borderRadius: '25px 0 0 0' },
                windowBack: { width: '90px', height: '60px', bottom: '140px', left: '200px', borderRadius: '0 25px 0 0' }
            },
            deportivo: {
                body: { width: '360px', height: '70px', bottom: '38px', left: '20px', borderRadius: '30px 30px 8px 8px' },
                roof: { width: '180px', height: '50px', bottom: '108px', left: '110px', borderRadius: '25px 25px 0 0' },
                windowFront: { width: '70px', height: '45px', bottom: '113px', left: '115px', borderRadius: '20px 0 0 0' },
                windowBack: { width: '70px', height: '45px', bottom: '113px', left: '205px', borderRadius: '0 20px 0 0' }
            },
            pickup: {
                body: { width: '370px', height: '75px', bottom: '40px', left: '15px', borderRadius: '15px 15px 10px 10px' },
                roof: { width: '140px', height: '60px', bottom: '115px', left: '70px', borderRadius: '30px 30px 0 0' },
                windowFront: { width: '55px', height: '50px', bottom: '120px', left: '80px', borderRadius: '25px 0 0 0' },
                windowBack: { width: '45px', height: '50px', bottom: '120px', left: '150px', borderRadius: '0 20px 0 0' }
            }
        };

        function selectCarType(type) {
            currentCarType = type;
            
            // Actualizar selección visual
            document.querySelectorAll('.factory-car').forEach(car => {
                car.classList.remove('selected');
            });
            document.querySelector(`[data-type="${type}"]`).classList.add('selected');

            // Aplicar estilos del tipo de coche
            const style = carStyles[type];
            
            Object.assign(carBody.style, style.body);
            Object.assign(carRoof.style, style.roof);
            Object.assign(windowFront.style, style.windowFront);
            Object.assign(windowBack.style, style.windowBack);
        }

        document.getElementById('carColor').addEventListener('input', (e) => {
            carBody.style.background = e.target.value;
            carRoof.style.background = e.target.value;
        });

        document.getElementById('windowColor').addEventListener('input', (e) => {
            const color = e.target.value;
            const rgb = hexToRgb(color);
            windowFront.style.background = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.6)`;
            windowBack.style.background = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.6)`;
        });

        document.getElementById('mirrors').addEventListener('change', (e) => {
            const show = e.target.value === 'yes';
            mirrorLeft.style.display = show ? 'block' : 'none';
            mirrorRight.style.display = show ? 'block' : 'none';
        });

        document.getElementById('wheelType').addEventListener('change', (e) => {
            wheelFront.className = 'wheel wheel-front';
            wheelBack.className = 'wheel wheel-back';
            
            if (e.target.value === 'sport') {
                wheelFront.classList.add('sport');
                wheelBack.classList.add('sport');
            } else if (e.target.value === 'off-road') {
                wheelFront.classList.add('off-road');
                wheelBack.classList.add('off-road');
            }
        });

        document.getElementById('spoiler').addEventListener('change', (e) => {
            spoilerEl.style.display = e.target.value === 'yes' ? 'block' : 'none';
        });

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 100, g: 200, b: 255 };
        }
    </script>
</body>
</html>
